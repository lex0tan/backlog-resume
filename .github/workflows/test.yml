name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Configure git identity (tests create repositories)
        run: |
          git config --global user.email ci@example.com
          git config --global user.name CI
      # Explicit files: plain `node --test` on Node 23+ also runs hooks/*.test.ts, which only `claude plugin test` can run.
      # bash expands the glob on every OS (Node 20 does not expand globs itself).
      - run: node --test test/*.test.mjs
        shell: bash

  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm i -g @anthropic-ai/claude-code
      - run: claude plugin validate .
      - run: claude plugin test .
