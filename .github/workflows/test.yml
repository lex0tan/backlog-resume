name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Configure git identity (tests create repositories)
        run: |
          git config --global user.email ci@example.com
          git config --global user.name CI
      - run: node --test

  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm i -g @anthropic-ai/claude-code
      - run: claude plugin validate .
      - name: Plugin tests (skipped until hooks tests exist)
        run: |
          if ls hooks/*.test.ts hooks/*.test.tsx >/dev/null 2>&1; then claude plugin test .; else echo "no hooks tests yet"; fi
